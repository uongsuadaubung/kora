[package]
name = "kora"
version = "0.5.0"
edition = "2024"
authors = ["Mạnh Kiên <manhkien13041997@gmail.com>"]
description = "Kora - Hệ sinh thái Bàn phím & Bộ gõ thế hệ mới viết bằng Rust"
repository = "https://github.com/uongsuadaubung/kora"
default-run = "Kora"

[lib]
name = "kora"
path = "src/lib.rs"

[[bin]]
name = "Kora"
path = "src/main.rs"

[[example]]
name = "combinatorial_tester"
path = "examples/combinatorial_tester.rs"

[dependencies]

[build-dependencies]
winres = "0.1.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
