[package]
name = "kora"
version = "0.11.0"
edition = "2024"

authors = ["Mạnh Kiên <manhkien13041997@gmail.com>"]
description = "Kora - Modern Input & Keyboard Suite written in Rust"
repository = "https://github.com/uongsuadaubung/kora"
default-run = "Kora"

[lib]
name = "kora"
path = "src/lib.rs"

[[bin]]
name = "Kora"
path = "src/main.rs"

[[example]]
name = "benchmark"
path = "examples/benchmark.rs"


[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow"] }
winit = { version = "0.30", default-features = false }
[build-dependencies]
winres = "0.1.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1

